<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link href="css/htmlviewer.css" rel="stylesheet" />
    <link href="_content/Spillgebees.Blazor.RichTextEditor/Spillgebees.Blazor.RichTextEditor.lib.module.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <title>ReceptyOks Blazor Components</title>
</head>
<body>
    <div id="app">Loading...</div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        (function startBlazor() {
            var maxRetries = 3, attempt = 0;
            function tryStart() {
                attempt++;
                if (typeof Blazor !== 'undefined' && Blazor.start) {
                    Blazor.start().catch(function(err) {
                        if (attempt < maxRetries) setTimeout(tryStart, 500 * attempt);
                        else console.error('Blazor init failed:', err);
                    });
                } else if (attempt < maxRetries) {
                    setTimeout(tryStart, 300 * attempt);
                }
            }
            tryStart();
        })();
    </script>
</body>
</html>
