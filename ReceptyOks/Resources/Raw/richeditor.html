<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Text Editor</title>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f1f1f;
            --border-color: #e0e0e0;
            --toolbar-bg: #f5f5f5;
            --primary-color: #512BD4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1f1f1f;
                --text-color: #ffffff;
                --border-color: #404040;
                --toolbar-bg: #2d2d2d;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .editor-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Quill customization */
          .ql-toolbar.ql-snow {
                border: none;
                border-bottom: 1px solid var(--border-color);
                background-color: var(--toolbar-bg);
                 padding: 8px;
           }

        .ql-container.ql-snow {
            border: none;
            flex: 1;
            font-size: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .ql-editor {
            padding: 16px;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .ql-editor.ql-blank::before {
    color: #999;
            font-style: normal;
  }

        .ql-editor h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .ql-editor h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .ql-editor h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .ql-editor p {
            margin-bottom: 12px;
        }

        .ql-editor ol, .ql-editor ul {
            padding-left: 24px;
            margin-bottom: 12px;
        }

        .ql-editor blockquote {
            border-left: 3px solid var(--primary-color);
            padding-left: 16px;
            margin: 12px 0;
        }

        /* Dark mode toolbar buttons */
        @media (prefers-color-scheme: dark) {
            .ql-snow .ql-stroke {
                stroke: #ccc;
            }
            .ql-snow .ql-fill {
                fill: #ccc;
            }
            .ql-snow .ql-picker-label {
                color: #ccc;
            }
            .ql-snow .ql-picker-options {
                background-color: #2d2d2d;
            }
            .ql-snow .ql-picker-item {
                color: #ccc;
            }
            .ql-toolbar.ql-snow .ql-picker.ql-expanded .ql-picker-options {
                border-color: #404040;
            }
        }

        /* Active button state */
        .ql-snow .ql-active .ql-stroke {
            stroke: var(--primary-color) !important;
        }
        .ql-snow .ql-active .ql-fill {
            fill: var(--primary-color) !important;
        }
        .ql-snow .ql-active {
            color: var(--primary-color) !important;
        }
    </style>
</head>
<body>
    <div class="editor-wrapper">
        <div id="toolbar">
            <span class="ql-formats">
                <button class="ql-bold" title="Pogrubienie"></button>
                <button class="ql-italic" title="Kursywa"></button>
                <button class="ql-underline" title="Podkre�lenie"></button>
                <button class="ql-strike" title="Przekre�lenie"></button>
            </span>
            <span class="ql-formats">
                <select class="ql-header" title="Nag��wek">
                    <option value="1">Nag��wek 1</option>
                    <option value="2">Nag��wek 2</option>
                    <option value="3">Nag��wek 3</option>
                    <option selected>Normalny</option>
                </select>
            </span>
            <span class="ql-formats">
                <button class="ql-list" value="ordered" title="Lista numerowana"></button>
                <button class="ql-list" value="bullet" title="Lista punktowana"></button>
            </span>
            <span class="ql-formats">
                <button class="ql-blockquote" title="Cytat"></button>
            </span>
            <span class="ql-formats">
                <button class="ql-clean" title="Wyczy�� formatowanie"></button>
            </span>
        </div>
        <div id="editor"></div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script>
        let quill;

        // Inicjalizacja edytora
        function initEditor(initialContent) {
            quill = new Quill('#editor', {
                theme: 'snow',
                modules: {
                    toolbar: '#toolbar'
                },
                placeholder: 'Opisz krok po kroku przygotowanie dania...'
            });

            if (initialContent) {
                quill.root.innerHTML = initialContent;
            }

            // Nasłuchuj zmian
            quill.on('text-change', function() {
                notifyContentChanged();
            });
            
            // Log inicjalizacji
            console.log('Quill editor initialized');
            logToConsole('Editor initialized successfully');
        }

        // Pobierz zawartość HTML
        function getContent() {
            const html = quill ? quill.root.innerHTML : '';
            console.log('getContent called, returning:', html.substring(0, 100) + '...');
            logToConsole('getContent called, length: ' + html.length);
            return html;
        }

        // Ustaw zawartość HTML
        function setContent(html) {
            if (quill) {
                quill.root.innerHTML = html || '';
                console.log('setContent called with length:', (html || '').length);
                logToConsole('setContent called, length: ' + (html || '').length);
            }
        }

        // Powiadom MAUI o zmianie zawartości
        function notifyContentChanged() {
            try {
                const html = getContent();
                const message = JSON.stringify({ type: 'contentChanged', html: html });
                
                console.log('Notifying content change, length:', html.length);
                
                if (window.chrome && window.chrome.webview) {
                    // Windows WebView2
                    window.chrome.webview.postMessage(message);
                    logToConsole('Message sent via chrome.webview');
                } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.invokeAction) {
                    // iOS/macOS
                    window.webkit.messageHandlers.invokeAction.postMessage(message);
                    logToConsole('Message sent via webkit.messageHandlers');
                } else {
                    logToConsole('WARNING: No message handler found!');
                }
            } catch (e) {
                console.error('Notify error:', e);
                logToConsole('ERROR: ' + e.message);
            }
        }
        
        // Funkcja pomocnicza do logowania (widoczna w konsoli przeglądarki)
        function logToConsole(message) {
            console.log('[RichEditor] ' + message);
        }
        
        // Test komunikacji - zwraca prostą wiadomość
        function testCommunication() {
            const testMessage = 'Test message from richeditor.html at ' + new Date().toISOString();
            console.log('Test communication:', testMessage);
            return testMessage;
        }

        // Inicjalizacja po załadowaniu strony
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOMContentLoaded event fired');
            initEditor('');
        });
    </script>
</body>
</html>
