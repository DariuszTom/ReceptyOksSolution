<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recipe Instructions</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f1f1f;
            --border-color: #e0e0e0;
            --primary-color: #512BD4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1f1f1f;
                --text-color: #ffffff;
                --border-color: #404040;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: transparent;
            color: var(--text-color);
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        h3 {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        p {
            margin-bottom: 12px;
        }

        ol, ul {
            padding-left: 24px;
            margin-bottom: 12px;
        }

        li {
            margin-bottom: 6px;
        }

        blockquote {
            border-left: 3px solid var(--primary-color);
            padding-left: 16px;
            margin: 12px 0;
            font-style: italic;
        }

        strong {
            font-weight: bold;
        }

        em {
            font-style: italic;
        }

        u {
            text-decoration: underline;
        }

        s {
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    {{CONTENT}}
</body>
</html>
