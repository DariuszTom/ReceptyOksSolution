<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ikona: dwa dymki czatu ze świecącym błyskiem AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#B06AF5"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.74" cy="0.20" r="0.75">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#B06AF5"/>
    </linearGradient>
  </defs>

  <!-- icon tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bloom)"/>

  <!-- subtle constellation -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.12" fill="none">
    <path d="M60 452 L112 486 L150 430 L60 452"/>
    <path d="M112 486 L176 492"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.22">
    <circle cx="60" cy="452" r="4.5"/>
    <circle cx="112" cy="486" r="5.5"/>
    <circle cx="150" cy="430" r="3.5"/>
    <circle cx="176" cy="492" r="3"/>
  </g>

  <!-- back bubble (incoming message) -->
  <path d="M132 112 L94 74 L186 116 Z" fill="#FFFFFF" fill-opacity="0.15"/>
  <rect x="84" y="104" width="244" height="150" rx="42" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="2.5"/>
  <g fill="#FFFFFF" fill-opacity="0.60">
    <circle cx="166" cy="179" r="9"/>
    <circle cx="206" cy="179" r="9"/>
    <circle cx="246" cy="179" r="9"/>
  </g>

  <!-- front bubble (AI reply) -->
  <path d="M372 352 L412 410 L320 360 Z" fill="#FFFFFF"/>
  <rect x="196" y="206" width="236" height="158" rx="42" fill="#FFFFFF"/>
  <ellipse cx="314" cy="286" rx="98" ry="66" fill="url(#sparkGlow)"/>

  <!-- AI sparks -->
  <path d="M314 232 Q314 286 368 286 Q314 286 314 340 Q314 286 260 286 Q314 286 314 232 Z" fill="url(#spark)"/>
  <path d="M262 242 Q262 262 282 262 Q262 262 262 282 Q262 262 242 262 Q262 262 262 242 Z" fill="url(#spark)"/>
  <circle cx="374" cy="252" r="6" fill="url(#spark)"/>
  <circle cx="276" cy="334" r="5" fill="url(#spark)"/>
</svg>
