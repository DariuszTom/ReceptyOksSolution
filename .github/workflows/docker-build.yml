name: Build and Push Docker Image

# ---------------------------------------------------------------------------
# Release model
# ---------------------------------------------------------------------------
# The Azure Container App is pinned in Bicep to the ':release' tag.
# Regular pushes to master DO NOT change ':release' - they only publish a
# freshly built ':<sha>' (and ':master') image to GHCR for testing.
#
# To promote a build to production:
#   1. GitHub -> Actions -> "Build and Push Docker Image" -> Run workflow
#   2. Set promote = 'true'
#      (optionally set source_tag to promote an older SHA/master build
#       instead of the current commit - e.g. 'a1b2c3d' or 'master')
#   3. Click "Run workflow"
#
# The workflow will:
#   - Build & push ':<sha>' (and ':master' when run on master)
#   - Retag the built (or specified source_tag) image as ':release' in GHCR
#   - Restart the Azure Container App so it pulls the new ':release'
#
# Rollback:
#   Run this workflow again with promote=true and source_tag=<previous-sha>.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - master
    paths:
      - 'ReceptyOks.Api/**'
      - 'ReceptyOks.Shared/**'
      - 'ReceptyOksSolution.ServiceDefaults/**'
  pull_request:
    branches:
      - master
    paths:
      - 'ReceptyOks.Api/**'
      - 'ReceptyOks.Shared/**'
      - 'ReceptyOksSolution.ServiceDefaults/**'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote the built image to :release and restart Azure Container App'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      source_tag:
        description: 'Existing GHCR tag to promote to :release (leave empty to use the just-built commit SHA)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/receptyoks-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha_tag: ${{ steps.image_meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # NOTE: ':release' is deliberately NOT produced here. It is only ever
          # set by the 'promote' job below, so untested builds cannot end up
          # in Azure.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ReceptyOks.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image SHA tag for downstream jobs
        id: image_meta
        # docker/metadata-action publishes 'type=sha' as a short 7-char SHA;
        # export the same short form so the promote job references a tag
        # that actually exists in GHCR.
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  promote:
    name: Promote to :release and deploy
    needs: build
    # Promote runs ONLY when the workflow is dispatched manually with promote=true.
    # Regular pushes to master never trigger a deploy.
    if: >
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag source image as :release
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"
          SOURCE_TAG="${{ github.event.inputs.source_tag }}"
          if [[ -z "${SOURCE_TAG}" ]]; then
            SOURCE_TAG="${{ needs.build.outputs.image_sha_tag }}"
          fi
          SOURCE="ghcr.io/${OWNER}/receptyoks-api:${SOURCE_TAG}"
          TARGET="ghcr.io/${OWNER}/receptyoks-api:release"
          echo "Promoting ${SOURCE} -> ${TARGET}"
          docker pull "${SOURCE}"
          docker tag "${SOURCE}" "${TARGET}"
          docker push "${TARGET}"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Container App to pull new :release image
        # The Container App is pinned to ':release' in Bicep; because the tag is
        # mutable, we only need to restart the latest revision to force a fresh pull.
        run: |
          REVISION=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          az containerapp revision restart \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision "$REVISION"
          echo "Restarted revision: $REVISION"
