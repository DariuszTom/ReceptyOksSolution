name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'ReceptyOks.Api/**'
      - 'ReceptyOks.Shared/**'
      - 'ReceptyOksSolution.ServiceDefaults/**'
  pull_request:
    branches:
      - master
    paths:
      - 'ReceptyOks.Api/**'
      - 'ReceptyOks.Shared/**'
      - 'ReceptyOksSolution.ServiceDefaults/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/receptyoks-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha_tag: ${{ steps.image_meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ReceptyOks.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image SHA tag for downstream jobs
        id: image_meta
        # docker/metadata-action publishes 'type=sha' as a short 7-char SHA by default;
        # export the same short form so the deploy job references a tag that actually exists.
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Azure Container App
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App to new GHCR image
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"
          SHA="${{ needs.build.outputs.image_sha_tag }}"
          IMAGE="ghcr.io/${OWNER}/receptyoks-api:${SHA}"
          echo "Deploying image: ${IMAGE}"
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "${IMAGE}"

      - name: Restart latest revision
        run: |
          REVISION=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          az containerapp revision restart \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision "$REVISION"
          echo "Restarted revision: $REVISION"
