# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install Android workload
      # Install only Android workload since iOS/macOS workloads are not available on Linux
      run: dotnet workload install maui-android
    - name: Restore API dependencies
      run: dotnet restore ReceptyOks.Api/ReceptyOks.Api.csproj
    - name: Build MAUI Android
      # Only build Android on Ubuntu since iOS/macOS workloads require macOS
    # Note: Not using --no-restore because project references need proper restore graph
      run: dotnet build ReceptyOks/ReceptyOks.csproj -f net10.0-android
    - name: Build API
      run: dotnet build ReceptyOks.Api/ReceptyOks.Api.csproj --no-restore
    - name: Build Shared
      run: dotnet build ReceptyOks.Shared/ReceptyOks.Shared.csproj --no-restore
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install MAUI workload
      run: dotnet workload install maui
    - name: Restore Test dependencies
      run: dotnet restore ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj
    - name: Build Tests
      run: dotnet build ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj --no-restore
    - name: Test
      run: dotnet test ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=lcov