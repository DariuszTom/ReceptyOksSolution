# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install Android workload
      # Install only Android workload since iOS/macOS workloads are not available on Linux
      run: dotnet workload install maui-android
    - name: Restore dependencies
      run: dotnet restore ReceptyOks/ReceptyOks.csproj -p:TargetFramework=net10.0-android
    - name: Restore API dependencies
      run: dotnet restore ReceptyOks.Api/ReceptyOks.Api.csproj
    - name: Restore Shared dependencies
      run: dotnet restore ReceptyOks.Shared/ReceptyOks.Shared.csproj
    - name: Build MAUI Android
      # Only build Android on Ubuntu since iOS/macOS workloads require macOS
      run: dotnet build ReceptyOks/ReceptyOks.csproj -f net10.0-android --no-restore
    - name: Build API
      run: dotnet build ReceptyOks.Api/ReceptyOks.Api.csproj --no-restore
    - name: Build Shared
      run: dotnet build ReceptyOks.Shared/ReceptyOks.Shared.csproj --no-restore
    - name: Test
      run: dotnet test ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=lcov