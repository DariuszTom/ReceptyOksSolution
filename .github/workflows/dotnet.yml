# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore workloads
      run: dotnet workload restore --skip-sign-check
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      # Only build Android on Ubuntu since iOS/macOS workloads require macOS
      run: dotnet build ReceptyOks/ReceptyOks.csproj -f net10.0-android --no-restore
    - name: Build API
      run: dotnet build ReceptyOks.Api/ReceptyOks.Api.csproj --no-restore
    - name: Build Shared
      run: dotnet build ReceptyOks.Shared/ReceptyOks.Shared.csproj --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal