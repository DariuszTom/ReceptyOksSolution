name: Push Docker Image to Azure Container Registry

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Image"
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  build-and-push:
    # Run only when the upstream workflow finished successfully
    # and that upstream workflow was triggered manually (workflow_dispatch)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull from GHCR, retag and push to ACR
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"
          IMAGE="ghcr.io/$OWNER/receptyoks-api:latest"
          TARGET="$ACR_NAME.azurecr.io/$OWNER/receptyoks-api:latest"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$TARGET"
          docker push "$TARGET"
