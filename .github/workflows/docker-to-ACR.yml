# =====================================================
# DISABLED - Push Docker Image to Azure Container Registry
# =====================================================
# This workflow is intentionally disabled after migrating to GHCR
# (see .github/workflows/docker-build.yml deploy job).
#
# It is kept here (instead of deleted) as a rollback safety net in case
# GHCR pulls need to be replaced with ACR again (private registry, rate
# limits, Managed Identity requirement, etc.).
#
# TO RE-ENABLE:
#   1. Uncomment all lines below (remove leading '# ').
#   2. Ensure repository secrets are present:
#      ACR_NAME, AZURE_CREDENTIALS, CONTAINER_APP_NAME, AZURE_RESOURCE_GROUP
#   3. In main.bicep set 'containerRegistry' to '<ACR_NAME>.azurecr.io'
#      and restore the 'registries' block on the Container App
#      (see comment in main.bicep near the removed registries entry).
#   4. Remove the 'deploy' job from docker-build.yml so it does not
#      race with this workflow.
# =====================================================

name: Push Docker Image to Azure Container Registry (DISABLED)

# No active triggers - workflow_dispatch kept only so the workflow
# remains visible in the Actions UI; the single no-op job below
# prevents accidental execution.
on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "This workflow is disabled. See file header for re-enable steps."
          exit 0

