name: Push Docker Image to Azure Container Registry

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Image"
    types:
      - completed
  workflow_dispatch:  # allow manual trigger of ACR push directly

permissions:
  contents: read
  packages: read

jobs:
  build-and-push:
    # Run when: upstream workflow finished successfully (manual dispatch) OR this workflow is triggered directly
    if: >
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull from GHCR, retag and push to ACR
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"
          SHA="${{ github.sha }}"
          IMAGE="ghcr.io/$OWNER/receptyoks-api:latest"
          TARGET_LATEST="$ACR_NAME.azurecr.io/$OWNER/receptyoks-api:latest"
          TARGET_SHA="$ACR_NAME.azurecr.io/$OWNER/receptyoks-api:$SHA"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$TARGET_LATEST"
          docker tag "$IMAGE" "$TARGET_SHA"
          docker push "$TARGET_LATEST"
          docker push "$TARGET_SHA"

      - name: Update Azure Container App
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"
          SHA="${{ github.sha }}"
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image $ACR_NAME.azurecr.io/$OWNER/receptyoks-api:$SHA

      - name: Restart Container App to use new image
        run: |
          # Pobierz nazwę najnowszej rewizji
          REVISION=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)

          # Restart rewizji żeby pobrać nowy obraz
          az containerapp revision restart \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision $REVISION

          echo "✅ Restarted revision: $REVISION"

