name: Code Coverage

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Install MAUI workload
      run: dotnet workload install maui
    
    - name: Restore dependencies
      run: dotnet restore ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj
    
    - name: Build tests
      run: dotnet build ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj --no-restore --configuration Release
    
    - name: Run tests with coverage
      run: dotnet test ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    
    - name: Generate coverage report
      run: reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage-report -reporttypes:"Html;MarkdownSummaryGithub;Cobertura"
    
    - name: Display coverage summary
      if: always()
      run: |
        if (Test-Path "./coverage-report/SummaryGithub.md") {
          Get-Content "./coverage-report/SummaryGithub.md"
        }
    
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage-report
        retention-days: 30
    
    - name: Check coverage thresholds
      if: always()
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem -Path "./coverage-report" -Filter "Cobertura.xml" -Recurse | Select-Object -First 1
        if ($coverageFile) {
          [xml]$coverage = Get-Content "$($coverageFile.FullName)"
          $lineRate = [double]$coverage.coverage.'line-rate'
          $linePercent = $lineRate * 100
          
          Write-Host "📊 Line Coverage: $([math]::Round($linePercent, 2))%" -ForegroundColor Cyan
          
          $minCoverage = 25
          if ($linePercent -lt $minCoverage) {
            Write-Warning "Coverage ($([math]::Round($linePercent, 2))%) is below minimum ($minCoverage%)"
          } else {
            Write-Host "✅ Coverage threshold met!" -ForegroundColor Green
          }
        }
