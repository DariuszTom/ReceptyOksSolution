name: Code coverage scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  coverage:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better blame info

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj -p:RuntimeIdentifiers=win-x64

    - name: Build solution
      run: dotnet build ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj --no-restore --configuration Release -p:RuntimeIdentifier=win-x64

    - name: Run tests with coverage
      run: |
        dotnet test ReceptyOks_UnitTests/ReceptyOks_UnitTests.csproj `
          --no-build `
          --configuration Release `
          --verbosity normal `
          --collect:"XPlat Code Coverage" `
          --results-directory ./coverage `
          --logger "trx;LogFileName=test-results.trx" `
          --settings .github/coverlet.runsettings `
          -p:RuntimeIdentifier=win-x64

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: |
        reportgenerator `
          -reports:./coverage/**/coverage.cobertura.xml `
          -targetdir:./coverage-report `
          -reporttypes:"Html;MarkdownSummaryGithub;Badges;Cobertura" `
          -verbosity:Info

    - name: Display coverage summary
      if: always()
      run: |
        if (Test-Path "./coverage-report/SummaryGithub.md") {
          Get-Content "./coverage-report/SummaryGithub.md"
        }

    - name: Add coverage PR comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        path: ./coverage-report/SummaryGithub.md

    - name: Upload coverage report artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage-report
        retention-days: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./coverage/test-results.trx
        retention-days: 30

    - name: Check coverage threshold
      shell: pwsh
      run: |
        [xml]$coverage = Get-Content "./coverage-report/Cobertura.xml"
        $lineRate = [double]$coverage.coverage.'line-rate'
        $branchRate = [double]$coverage.coverage.'branch-rate'

        $linePercent = $lineRate * 100
        $branchPercent = $branchRate * 100

        Write-Host "Line Coverage: $([math]::Round($linePercent, 2))%"
        Write-Host "Branch Coverage: $([math]::Round($branchPercent, 2))%"

        # Set minimum thresholds
        $minLineCoverage = 25
        $minBranchCoverage = 20

        if ($linePercent -lt $minLineCoverage) {
          Write-Error "Line coverage ($([math]::Round($linePercent, 2))%) is below threshold ($minLineCoverage%)"
          exit 1
        }

        if ($branchPercent -lt $minBranchCoverage) {
          Write-Error "Branch coverage ($([math]::Round($branchPercent, 2))%) is below threshold ($minBranchCoverage%)"
          exit 1
        }

        Write-Host "✅ Coverage thresholds met!"

    - name: Publish coverage summary
      if: always()
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ./coverage-report/Cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both
        thresholds: '25 50'

